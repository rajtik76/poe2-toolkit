name: Release

# Publishes the @poe2-toolkit packages to npm when a GitHub Release is published.
# Bump the version(s) you want to ship, then cut a Release (or push a tag and
# publish a release from it). Only packages whose version is not yet on npm are
# published, so partial releases are safe.
#
# Publishes directly through npm trusted publishing (OIDC), without an npm
# token. Each package must have a saved GitHub Actions Trusted Publisher:
# owner rajtik76, repository poe2-toolkit, workflow release.yml, no environment,
# Allow npm publish enabled. Publishing access can continue to require 2FA and
# disallow bypass tokens; that setting does not block trusted publishers.
on:
  release:
    types: [published]
  # Manual recovery can publish one package while its siblings are configured.
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        default: all
        options:
          - all
          - ggpk
          - tree-core
          - tree-react
          - tree-extractor
          - item-extractor
          - gem-extractor
          - rune-extractor
          - mod-extractor
      dry_run:
        description: Validate packaging without publishing
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a short-lived publish credential

# Releases publish to npm. Serialize them so several tags published together
# don't race to publish a shared dependency package (which 403s on the version a
# sibling run just shipped). Never cancel an in-flight release mid-publish — let
# them queue and run one at a time.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # Never cache in a release build (npm's trusted publishing guidance).
          package-manager-cache: false
      # Pin a CLI with OIDC support so releases do not change with npm@latest.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@12.2.0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Publish new versions to npm
        run: |
          args=()
          if [[ "$RELEASE_PACKAGE" != "all" ]]; then
            args+=(--package "$RELEASE_PACKAGE")
          fi
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/publish-changed.mjs "${args[@]}"
        env:
          RELEASE_PACKAGE: ${{ inputs.package || 'all' }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          NPM_CONFIG_LOGLEVEL: verbose
